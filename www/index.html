<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AI Assistant</title>
<style>
  :root {
    --bg: #0e0f12;
    --bg-alt: #16181d;
    --bubble-user: #2f6fed;
    --bubble-ai: #1f2229;
    --text: #eef0f4;
    --text-dim: #8a8f98;
    --accent: #2f6fed;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
    background: var(--bg-alt);
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  header button {
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
  }
  header button:active { background: #22252b; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: var(--danger);
    font-size: 13px;
    text-align: center;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--text-dim);
    font-style: italic;
  }
  .empty-hint {
    color: var(--text-dim);
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 24px;
  }
  #inputbar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 10px) + 10px) 12px;
    background: var(--bg-alt);
    border-top: 1px solid #22252b;
  }
  #textInput {
    flex: 1;
    resize: none;
    border: 1px solid #2a2d34;
    background: #1a1c21;
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    max-height: 120px;
    min-height: 42px;
    outline: none;
    font-family: inherit;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.4; }
  #sendBtn svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">AI Assistant</div>
      <div class="sub" id="statusLine">автономный режим · память на устройстве</div>
    </div>
    <button id="clearBtn">Очистить</button>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <textarea id="textInput" rows="1" placeholder="Напишите сообщение..."></textarea>
    <button id="sendBtn" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "ai_assistant_local_memory_v1";
  var API_ENDPOINT = "https://text.pollinations.ai/";

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("textInput");
  var sendBtn = document.getElementById("sendBtn");
  var clearBtn = document.getElementById("clearBtn");
  var statusLine = document.getElementById("statusLine");

  /** @type {{role: "user"|"assistant", content: string}[]} */
  var history = [];

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        history = JSON.parse(raw);
      }
    } catch (e) {
      history = [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      /* storage full or unavailable — ignore, memory just won't persist */
    }
  }

  function renderAll() {
    messagesEl.innerHTML = "";
    if (history.length === 0) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Это ваш личный ИИ-ассистент. Он работает прямо на телефоне и запоминает переписку локально, без привязки к какому-либо аккаунту или серверу-посреднику. Напишите что-нибудь, чтобы начать.";
      messagesEl.appendChild(hint);
      return;
    }
    history.forEach(function (m) {
      appendBubble(m.role === "user" ? "user" : "ai", m.content);
    });
    scrollToBottom();
  }

  function appendBubble(kind, text) {
    var div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    messagesEl.appendChild(div);
    return div;
  }

  function scrollToBottom() {
    requestAnimationFrame(function () {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }

  function buildPrompt(userText) {
    // Keep a short rolling window of context so replies stay coherent
    // without sending huge payloads to the public inference endpoint.
    var recent = history.slice(-10);
    var lines = recent.map(function (m) {
      return (m.role === "user" ? "Пользователь: " : "Ассистент: ") + m.content;
    });
    lines.push("Пользователь: " + userText);
    lines.push("Ассистент:");
    return lines.join("\n");
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    inputEl.disabled = busy;
    statusLine.textContent = busy ? "печатает..." : "автономный режим · память на устройстве";
  }

  function sendMessage() {
    var text = inputEl.value.trim();
    if (!text) return;

    history.push({ role: "user", content: text });
    saveHistory();
    renderAll();

    inputEl.value = "";
    autoGrow();

    var typingBubble = appendBubble("typing", "печатает...");
    scrollToBottom();
    setBusy(true);

    var prompt = buildPrompt(text);
    var url = API_ENDPOINT + encodeURIComponent(prompt) + "?model=openai";

    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 30000);

    fetch(url, { method: "GET", signal: controller.signal })
      .then(function (res) {
        clearTimeout(timeout);
        if (!res.ok) throw new Error("Сервис ИИ вернул ошибку (" + res.status + ")");
        return res.text();
      })
      .then(function (reply) {
        typingBubble.remove();
        var clean = (reply || "").trim() || "(пустой ответ)";
        history.push({ role: "assistant", content: clean });
        saveHistory();
        renderAll();
      })
      .catch(function (err) {
        typingBubble.remove();
        var msg = err && err.name === "AbortError"
          ? "Не удалось получить ответ: истекло время ожидания. Проверьте подключение к интернету."
          : "Не удалось получить ответ: " + (err && err.message ? err.message : "нет соединения");
        appendBubble("error", msg);
        scrollToBottom();
      })
      .finally(function () {
        setBusy(false);
        inputEl.focus();
      });
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener("input", autoGrow);

  clearBtn.addEventListener("click", function () {
    if (!confirm("Очистить: Очистить всю историю переписки?")) return;
    history = [];
    saveHistory();
    renderAll();
  });

  loadHistory();
  renderAll();
})();
</script>
</body>
</html>
