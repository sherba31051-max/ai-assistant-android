<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AI Assistant</title>
<style>
  :root {
    --bg: #0e0f12;
    --bg-alt: #16181d;
    --bubble-user: #2f6fed;
    --bubble-ai: #1f2229;
    --text: #eef0f4;
    --text-dim: #8a8f98;
    --accent: #2f6fed;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
  }
  /* Smooth animated ambient background — subtle, slow-moving color blobs
     behind the chat. Purely decorative, GPU-composited, no layout impact. */
  #bgFx {
    position: absolute; inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #bgFx::before, #bgFx::after {
    content: "";
    position: absolute;
    width: 70vmax; height: 70vmax;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.22;
    will-change: transform;
  }
  #bgFx::before {
    background: radial-gradient(circle at 30% 30%, #2f6fed, transparent 70%);
    top: -20%; left: -20%;
    animation: bgDrift1 22s ease-in-out infinite alternate;
  }
  #bgFx::after {
    background: radial-gradient(circle at 70% 70%, #7c3aed, transparent 70%);
    bottom: -25%; right: -20%;
    animation: bgDrift2 26s ease-in-out infinite alternate;
  }
  @keyframes bgDrift1 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(8%, 10%) scale(1.15); }
  }
  @keyframes bgDrift2 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-10%, -8%) scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bgFx::before, #bgFx::after { animation: none; }
  }
  #app > header, #app > #messages, #app > #inputbar { position: relative; z-index: 1; }
  header {
    padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
    background: rgba(22, 24, 29, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    transition: background 0.3s ease;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  header .actions { display: flex; gap: 4px; flex-shrink: 0; }
  header button {
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  header button:active { background: #22252b; }
  #ghBtn.connected { color: #7ee787; }
  #messages { background: transparent; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: var(--danger);
    font-size: 13px;
    text-align: center;
    max-width: 100%;
  }
  .msg.error .retry-btn {
    display: inline-block;
    margin-top: 6px;
    background: var(--bubble-ai);
    color: var(--text);
    border: 1px solid #2a2d34;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--text-dim);
    font-style: italic;
  }
  .empty-hint {
    color: var(--text-dim);
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 24px;
  }
  #inputbar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 10px) + 10px) 12px;
    background: var(--bg-alt);
    border-top: 1px solid #22252b;
  }
  #textInput {
    flex: 1;
    resize: none;
    border: 1px solid #2a2d34;
    background: #1a1c21;
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    max-height: 120px;
    min-height: 42px;
    outline: none;
    font-family: inherit;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.4; }
  #sendBtn svg { width: 20px; height: 20px; }

  .lang-card {
    background: var(--bg-alt);
    border: 1px solid #22252b;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .lang-card .lang-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .lang-card .lang-count { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .lesson-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
    border-top: 1px solid #22252b;
    font-size: 14px;
  }
  .lesson-row:first-of-type { border-top: none; }
  .lesson-row .arrow { color: var(--text-dim); }
  #lessonDetail { display: none; }
  #lessonDetail.open { display: block; }
  #lessonDetail h3 { font-size: 18px; margin: 0 0 10px; }
  #lessonDetail p { font-size: 14px; line-height: 1.5; color: #cfd2d8; }
  #lessonDetail pre {
    background: #1a1c21;
    border: 1px solid #2a2d34;
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    color: #b7e07a;
  }
  .quiz-box {
    margin-top: 16px;
    background: var(--bg-alt);
    border: 1px solid #22252b;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .quiz-box .quiz-q { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .quiz-box .quiz-a { font-size: 14px; color: var(--text-dim); display: none; margin-top: 8px; }
  .quiz-box .quiz-a.shown { display: block; }
  .quiz-box button {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  #langList.open, #lessonList.open { display: block; }
  #langList, #lessonList { display: none; }

  /* Shared in-window sheet panels (Lessons + GitHub). Everything renders
     inside the single #app window — sheets slide up over the chat instead
     of navigating to a separate screen. */
  .sheet-backdrop {
    position: absolute; inset: 0;
    background: rgba(6, 7, 9, 0.55);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 5;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-height: 86%;
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    border-top: 1px solid #22252b;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 6;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: #2a2d34; margin: 10px auto 4px;
    flex-shrink: 0;
  }
  #lessonsScreen, #ghScreen { display: none; }
  #lessonsScreen.mounted, #ghScreen.mounted { display: block; }
  #lessonsHeader {
    padding: 4px 16px 12px 16px;
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #lessonsHeader .title { font-size: 17px; font-weight: 600; flex: 1; }
  #lessonsHeader button {
    background: none; border: none; color: var(--accent);
    font-size: 14px; padding: 6px 8px;
  }
  #lessonsBody { flex: 1; overflow-y: auto; padding: 12px 16px 24px; -webkit-overflow-scrolling: touch; }

  /* GitHub login sheet */
  #ghHeader {
    padding: 4px 16px 12px 16px;
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #ghHeader .title { font-size: 17px; font-weight: 600; flex: 1; }
  #ghHeader button {
    background: none; border: none; color: var(--accent);
    font-size: 14px; padding: 6px 8px;
  }
  #ghBody { flex: 1; overflow-y: auto; padding: 20px 20px 28px; text-align: center; }
  #ghBody p { color: var(--text-dim); font-size: 14px; line-height: 1.5; }
  #ghBody input {
    width: 100%; margin: 10px 0;
    background: #1a1c21; border: 1px solid #2a2d34; color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none;
    text-align: center;
  }
  .gh-code {
    font-size: 30px; font-weight: 700; letter-spacing: 4px;
    background: #1a1c21; border: 1px solid #2a2d34; border-radius: 12px;
    padding: 14px; margin: 14px 0; color: var(--accent);
  }
  .gh-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    background: var(--accent); color: white; border: none;
    border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 600;
    margin-top: 6px;
  }
  .gh-btn:disabled { opacity: 0.5; }
  .gh-btn.secondary { background: #1a1c21; color: var(--text); border: 1px solid #2a2d34; }
  .gh-user {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    margin: 10px 0 18px;
  }
  .gh-user img { width: 48px; height: 48px; border-radius: 50%; }
  .gh-user .name { font-size: 16px; font-weight: 600; }
  .gh-user .login { font-size: 13px; color: var(--text-dim); }
  .gh-status { font-size: 13px; color: var(--text-dim); margin-top: 10px; }
  .gh-error { font-size: 13px; color: var(--danger); margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="bgFx"></div>
  <header>
    <div>
      <div class="title">AI Assistant</div>
      <div class="sub" id="statusLine">загрузка локальной модели...</div>
    </div>
    <div class="actions">
      <button id="ghBtn">GitHub</button>
      <button id="lessonsBtn">Уроки</button>
      <button id="clearBtn">История</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <textarea id="textInput" rows="1" placeholder="Напишите сообщение..."></textarea>
    <button id="sendBtn" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>

  <div id="lessonsScreen" class="sheet">
    <div class="sheet-handle"></div>
    <div id="lessonsHeader">
      <button id="lessonsBackBtn">‹ Назад</button>
      <div class="title" id="lessonsTitle">Обучение языкам программирования</div>
    </div>
    <div id="lessonsBody">
      <div id="langList" class="open"></div>
      <div id="lessonList"></div>
      <div id="lessonDetail"></div>
    </div>
  </div>

  <div id="ghScreen" class="sheet">
    <div class="sheet-handle"></div>
    <div id="ghHeader">
      <div class="title">GitHub</div>
      <button id="ghCloseBtn">Закрыть</button>
    </div>
    <div id="ghBody"></div>
  </div>
</div>

<script src="lessons.js"></script>
<script src="app.bundle.js"></script>
</body>
</html>
