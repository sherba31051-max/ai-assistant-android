<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AI Assistant</title>
<style>
  :root {
    --bg: #0e0f12;
    --bg-alt: #16181d;
    --bubble-user: #2f6fed;
    --bubble-ai: #1f2229;
    --text: #eef0f4;
    --text-dim: #8a8f98;
    --accent: #2f6fed;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
    background: var(--bg-alt);
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  header .actions { display: flex; gap: 4px; }
  header button {
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
  }
  header button:active { background: #22252b; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: var(--danger);
    font-size: 13px;
    text-align: center;
    max-width: 100%;
  }
  .msg.error .retry-btn {
    display: inline-block;
    margin-top: 6px;
    background: var(--bubble-ai);
    color: var(--text);
    border: 1px solid #2a2d34;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--text-dim);
    font-style: italic;
  }
  .empty-hint {
    color: var(--text-dim);
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 24px;
  }
  #inputbar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 10px) + 10px) 12px;
    background: var(--bg-alt);
    border-top: 1px solid #22252b;
  }
  #textInput {
    flex: 1;
    resize: none;
    border: 1px solid #2a2d34;
    background: #1a1c21;
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    max-height: 120px;
    min-height: 42px;
    outline: none;
    font-family: inherit;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.4; }
  #sendBtn svg { width: 20px; height: 20px; }

  /* Lessons screen */
  #lessonsScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    z-index: 20;
  }
  #lessonsScreen.open { display: flex; }
  #lessonsHeader {
    padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
    background: var(--bg-alt);
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; gap: 10px;
  }
  #lessonsHeader .title { font-size: 17px; font-weight: 600; flex: 1; }
  #lessonsHeader button {
    background: none; border: none; color: var(--accent);
    font-size: 14px; padding: 6px 8px;
  }
  #lessonsBody { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  .lang-card {
    background: var(--bg-alt);
    border: 1px solid #22252b;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .lang-card .lang-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .lang-card .lang-count { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .lesson-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
    border-top: 1px solid #22252b;
    font-size: 14px;
  }
  .lesson-row:first-of-type { border-top: none; }
  .lesson-row .arrow { color: var(--text-dim); }
  #lessonDetail { display: none; }
  #lessonDetail.open { display: block; }
  #lessonDetail h3 { font-size: 18px; margin: 0 0 10px; }
  #lessonDetail p { font-size: 14px; line-height: 1.5; color: #cfd2d8; }
  #lessonDetail pre {
    background: #1a1c21;
    border: 1px solid #2a2d34;
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    color: #b7e07a;
  }
  .quiz-box {
    margin-top: 16px;
    background: var(--bg-alt);
    border: 1px solid #22252b;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .quiz-box .quiz-q { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .quiz-box .quiz-a { font-size: 14px; color: var(--text-dim); display: none; margin-top: 8px; }
  .quiz-box .quiz-a.shown { display: block; }
  .quiz-box button {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  #langList.open, #lessonList.open { display: block; }
  #langList, #lessonList { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">AI Assistant</div>
      <div class="sub" id="statusLine">загрузка локальной модели...</div>
    </div>
    <div class="actions">
      <button id="lessonsBtn">Уроки</button>
      <button id="clearBtn">Очистить</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <textarea id="textInput" rows="1" placeholder="Напишите сообщение..."></textarea>
    <button id="sendBtn" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<div id="lessonsScreen">
  <div id="lessonsHeader">
    <button id="lessonsBackBtn">‹ Назад</button>
    <div class="title" id="lessonsTitle">Обучение языкам программирования</div>
  </div>
  <div id="lessonsBody">
    <div id="langList" class="open"></div>
    <div id="lessonList"></div>
    <div id="lessonDetail"></div>
  </div>
</div>

<script src="lessons.js"></script>
<script src="app.bundle.js"></script>
</body>
</html>
