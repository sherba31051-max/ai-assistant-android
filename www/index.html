<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AI Assistant</title>
<style>
  :root {
    --bg: #0e0f12;
    --bg-alt: #16181d;
    --bubble-user: #2f6fed;
    --bubble-ai: #1f2229;
    --text: #eef0f4;
    --text-dim: #8a8f98;
    --accent: #2f6fed;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
    background: var(--bg-alt);
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  header .actions { display: flex; gap: 4px; }
  header button {
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
  }
  header button:active { background: #22252b; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: var(--danger);
    font-size: 13px;
    text-align: center;
    max-width: 100%;
  }
  .msg.error .retry-btn {
    display: inline-block;
    margin-top: 6px;
    background: var(--bubble-ai);
    color: var(--text);
    border: 1px solid #2a2d34;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--text-dim);
    font-style: italic;
  }
  .empty-hint {
    color: var(--text-dim);
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 24px;
  }
  #inputbar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 10px) + 10px) 12px;
    background: var(--bg-alt);
    border-top: 1px solid #22252b;
  }
  #textInput {
    flex: 1;
    resize: none;
    border: 1px solid #2a2d34;
    background: #1a1c21;
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    max-height: 120px;
    min-height: 42px;
    outline: none;
    font-family: inherit;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.4; }
  #sendBtn svg { width: 20px; height: 20px; }

  /* Lessons screen */
  #lessonsScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    z-index: 20;
  }
  #lessonsScreen.open { display: flex; }
  #lessonsHeader {
    padding: env(safe-area-inset-top, 12px) 16px 12px 16px;
    background: var(--bg-alt);
    border-bottom: 1px solid #22252b;
    display: flex; align-items: center; gap: 10px;
  }
  #lessonsHeader .title { font-size: 17px; font-weight: 600; flex: 1; }
  #lessonsHeader button {
    background: none; border: none; color: var(--accent);
    font-size: 14px; padding: 6px 8px;
  }
  #lessonsBody { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  .lang-card {
    background: var(--bg-alt);
    border: 1px solid #22252b;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .lang-card .lang-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .lang-card .lang-count { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .lesson-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
    border-top: 1px solid #22252b;
    font-size: 14px;
  }
  .lesson-row:first-of-type { border-top: none; }
  .lesson-row .arrow { color: var(--text-dim); }
  #lessonDetail { display: none; }
  #lessonDetail.open { display: block; }
  #lessonDetail h3 { font-size: 18px; margin: 0 0 10px; }
  #lessonDetail p { font-size: 14px; line-height: 1.5; color: #cfd2d8; }
  #lessonDetail pre {
    background: #1a1c21;
    border: 1px solid #2a2d34;
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    color: #b7e07a;
  }
  .quiz-box {
    margin-top: 16px;
    background: var(--bg-alt);
    border: 1px solid #22252b;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .quiz-box .quiz-q { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .quiz-box .quiz-a { font-size: 14px; color: var(--text-dim); display: none; margin-top: 8px; }
  .quiz-box .quiz-a.shown { display: block; }
  .quiz-box button {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  #langList.open, #lessonList.open { display: block; }
  #langList, #lessonList { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">AI Assistant</div>
      <div class="sub" id="statusLine">автономный режим · память на устройстве</div>
    </div>
    <div class="actions">
      <button id="lessonsBtn">Уроки</button>
      <button id="clearBtn">Очистить</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <textarea id="textInput" rows="1" placeholder="Напишите сообщение..."></textarea>
    <button id="sendBtn" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<div id="lessonsScreen">
  <div id="lessonsHeader">
    <button id="lessonsBackBtn">‹ Назад</button>
    <div class="title" id="lessonsTitle">Обучение языкам программирования</div>
  </div>
  <div id="lessonsBody">
    <div id="langList" class="open"></div>
    <div id="lessonList"></div>
    <div id="lessonDetail"></div>
  </div>
</div>

<script src="lessons.js"></script>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "ai_assistant_local_memory_v1";
  var PROFILE_KEY = "ai_assistant_profile_v1";
  var API_ENDPOINT = "https://text.pollinations.ai/";
  var CONTEXT_WINDOW = 3; // keep prompt short so URL stays well under length/budget limits
  // Rotate through several free models on the same endpoint — if one is
  // rate-limited (429) the others often have separate quotas/capacity.
  var MODELS = ["openai", "mistral", "llama", "openai-large"];
  var MAX_ATTEMPTS = 5;
  var ATTEMPT_TIMEOUT_MS = 15000;
  var RETRY_DELAY_MS = 1200;
  var RATE_LIMIT_EXTRA_DELAY_MS = 4000; // extra backoff specifically for 429s

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("textInput");
  var sendBtn = document.getElementById("sendBtn");
  var clearBtn = document.getElementById("clearBtn");
  var statusLine = document.getElementById("statusLine");
  var lessonsBtn = document.getElementById("lessonsBtn");

  /** @type {{role: "user"|"assistant", content: string}[]} */
  var history = [];
  /** @type {string[]} facts the user has stated about themselves */
  var profile = [];

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        history = JSON.parse(raw);
      }
    } catch (e) {
      history = [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      /* storage full or unavailable — ignore, memory just won't persist */
    }
  }

  function loadProfile() {
    try {
      var raw = localStorage.getItem(PROFILE_KEY);
      if (raw) profile = JSON.parse(raw);
    } catch (e) {
      profile = [];
    }
  }

  function saveProfile() {
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    } catch (e) { /* ignore */ }
  }

  // Very simple heuristic long-term memory: look for a few common
  // self-descriptive Russian phrases and remember them as short facts.
  // No AI/model call involved — this must be 100% reliable and offline.
  function extractFacts(text) {
    var patterns = [
      { re: /меня зовут ([^.,!\n]{2,40})/i, tpl: function (m) { return "Имя пользователя: " + m[1].trim() + "."; } },
      { re: /я работаю ([^.,!\n]{2,60})/i, tpl: function (m) { return "Пользователь работает: " + m[1].trim() + "."; } },
      { re: /я живу в ([^.,!\n]{2,40})/i, tpl: function (m) { return "Пользователь живёт в: " + m[1].trim() + "."; } },
      { re: /мне (\d{1,3}) лет/i, tpl: function (m) { return "Возраст пользователя: " + m[1] + " лет."; } }
    ];
    var found = [];
    patterns.forEach(function (p) {
      var m = text.match(p.re);
      if (m) found.push(p.tpl(m));
    });
    if (found.length) {
      found.forEach(function (fact) {
        if (profile.indexOf(fact) === -1) profile.push(fact);
      });
      if (profile.length > 20) profile = profile.slice(-20);
      saveProfile();
    }
  }

  function renderAll() {
    messagesEl.innerHTML = "";
    if (history.length === 0) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Это ваш личный ИИ-ассистент. Он работает прямо на устройстве и без учётной записи, без привязки к какому-либо аккаунту. Напишите что-нибудь, чтобы начать.";
      messagesEl.appendChild(hint);
      return;
    }
    history.forEach(function (m) {
      appendBubble(m.role === "user" ? "user" : "ai", m.content);
    });
    scrollToBottom();
  }

  function appendBubble(kind, text) {
    var div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    messagesEl.appendChild(div);
    return div;
  }

  function scrollToBottom() {
    requestAnimationFrame(function () {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }

  function buildPrompt(userText, webContext) {
    // Keep a SHORT rolling window of context so the encoded URL stays well
    // under the length that causes 402/timeout issues on the free endpoint.
    var recent = history.slice(-CONTEXT_WINDOW);
    var lines = [];
    if (profile.length) {
      lines.push("Что ты знаешь о пользователе: " + profile.join(" "));
    }
    if (webContext) {
      lines.push("Контекст из интернета: " + webContext);
    }
    recent.forEach(function (m) {
      lines.push((m.role === "user" ? "Пользователь: " : "Ассистент: ") + m.content);
    });
    lines.push("Пользователь: " + userText);
    lines.push("Ассистент:");
    return lines.join("\n");
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    inputEl.disabled = busy;
    statusLine.textContent = busy ? "печатает..." : "автономный режим · память на устройстве";
  }

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // Best-effort web search enrichment. Only fires for messages that look
  // like factual lookups, has a short timeout, and NEVER blocks/breaks the
  // main chat flow if it fails — errors are swallowed silently.
  function looksFactual(text) {
    return /(что такое|кто так|кто это|когда|где находится|сколько|почему|расскажи о|факты о)/i.test(text);
  }

  function extractSearchTerm(text) {
    var m = text.match(/(?:что такое|кто такой|кто такая|расскажи о|факты о)\s+(.+)/i);
    var term = m ? m[1] : text;
    return term.replace(/[?!.]+$/, "").trim().slice(0, 80);
  }

  function fetchWebContext(userText) {
    if (!looksFactual(userText)) return Promise.resolve(null);
    var term = extractSearchTerm(userText);
    if (!term) return Promise.resolve(null);

    var controller = new AbortController();
    var t = setTimeout(function () { controller.abort(); }, 5000);
    var url = "https://ru.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(term);

    return fetch(url, { method: "GET", signal: controller.signal })
      .then(function (res) {
        clearTimeout(t);
        if (!res.ok) return null;
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.extract) return null;
        return data.extract.slice(0, 500);
      })
      .catch(function () {
        return null; // best-effort only — silently ignore any failure
      });
  }

  // Single network attempt with its own short timeout. Tags rate-limit
  // errors (429) distinctly so the retry loop can back off longer and
  // switch models instead of hammering the same overloaded one.
  function attemptFetch(url) {
    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, ATTEMPT_TIMEOUT_MS);
    return fetch(url, { method: "GET", signal: controller.signal })
      .then(function (res) {
        clearTimeout(timeout);
        if (!res.ok) {
          var err = new Error("Сервер ИИ вернул ошибку (" + res.status + ")");
          err.status = res.status;
          throw err;
        }
        return res.text();
      })
      .finally(function () { clearTimeout(timeout); });
  }

  // Retries across multiple free models with backoff. The free inference
  // endpoint frequently hangs/cold-starts or rate-limits (429) a given
  // model, but rotating to another model + waiting longer materially
  // improves reliability without needing any backend/API key.
  function fetchWithRetry(promptText, attemptsLeft, modelIdx) {
    modelIdx = modelIdx || 0;
    var model = MODELS[modelIdx % MODELS.length];
    var url = API_ENDPOINT + encodeURIComponent(promptText) + "?model=" + model;
    return attemptFetch(url).catch(function (err) {
      if (attemptsLeft <= 1) throw err;
      var isRateLimited = err && err.status === 429;
      var waitMs = RETRY_DELAY_MS + (isRateLimited ? RATE_LIMIT_EXTRA_DELAY_MS : 0);
      // On rate limit, always hop to the next model; otherwise keep same one.
      var nextModelIdx = isRateLimited ? modelIdx + 1 : modelIdx;
      return delay(waitMs).then(function () {
        return fetchWithRetry(promptText, attemptsLeft - 1, nextModelIdx);
      });
    });
  }

  function sendMessage() {
    var text = inputEl.value.trim();
    if (!text) return;

    extractFacts(text);

    history.push({ role: "user", content: text });
    saveHistory();
    renderAll();

    inputEl.value = "";
    autoGrow();

    var typingBubble = appendBubble("typing", "печатает...");
    scrollToBottom();
    setBusy(true);

    fetchWebContext(text)
      .then(function (webContext) {
        var prompt = buildPrompt(text, webContext);
        return fetchWithRetry(prompt, MAX_ATTEMPTS, 0);
      })
      .then(function (reply) {
        typingBubble.remove();
        var clean = (reply || "").trim() || "(пустой ответ)";
        history.push({ role: "assistant", content: clean });
        saveHistory();
        renderAll();
      })
      .catch(function (err) {
        typingBubble.remove();
        var msg = err && err.name === "AbortError"
          ? "Не удалось получить ответ от сервера: сервер слишком долго не отвечал даже после нескольких попыток."
          : err && err.status === 429
          ? "Сервис ИИ сейчас перегружен (лимит запросов). Мы попробовали несколько моделей — все ограничены. Подождите немного и нажмите «Повторить»."
          : "Не удалось получить ответ: " + (err && err.message ? err.message : "неизвестная ошибка");
        var bubble = appendBubble("error", msg);
        var retryBtn = document.createElement("button");
        retryBtn.className = "retry-btn";
        retryBtn.textContent = "Повторить";
        retryBtn.addEventListener("click", function () {
          bubble.remove();
          inputEl.value = text;
          sendMessage();
        });
        bubble.appendChild(document.createElement("br"));
        bubble.appendChild(retryBtn);
        scrollToBottom();
      })
      .finally(function () {
        setBusy(false);
        inputEl.focus();
      });
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener("input", autoGrow);

  clearBtn.addEventListener("click", function () {
    if (!confirm("Очистить: Очистить всю историю переписки?")) return;
    history = [];
    saveHistory();
    renderAll();
  });

  loadHistory();
  loadProfile();
  renderAll();

  // ---------------------------------------------------------------------
  // Programming lessons screen — fully static/offline content from
  // lessons.js. No network calls involved here.
  // ---------------------------------------------------------------------
  var lessonsScreen = document.getElementById("lessonsScreen");
  var lessonsBackBtn = document.getElementById("lessonsBackBtn");
  var lessonsTitle = document.getElementById("lessonsTitle");
  var langListEl = document.getElementById("langList");
  var lessonListEl = document.getElementById("lessonList");
  var lessonDetailEl = document.getElementById("lessonDetail");
  var LESSONS = (window.AI_ASSISTANT_LESSONS || {});

  var lessonsView = "langs"; // "langs" | "lessons" | "detail"
  var currentLang = null;
  var currentLessonIdx = null;

  function renderLangList() {
    langListEl.innerHTML = "";
    Object.keys(LESSONS).forEach(function (lang) {
      var card = document.createElement("div");
      card.className = "lang-card";
      card.innerHTML =
        '<div class="lang-name">' + lang + '</div>' +
        '<div class="lang-count">' + LESSONS[lang].length + ' урок(ов)</div>';
      card.addEventListener("click", function () {
        currentLang = lang;
        lessonsView = "lessons";
        renderLessonsView();
      });
      langListEl.appendChild(card);
    });
  }

  function renderLessonList() {
    lessonListEl.innerHTML = "";
    var lessons = LESSONS[currentLang] || [];
    lessons.forEach(function (lesson, idx) {
      var row = document.createElement("div");
      row.className = "lang-card";
      row.innerHTML =
        '<div class="lesson-row"><span>' + (idx + 1) + '. ' + lesson.title + '</span><span class="arrow">›</span></div>';
      row.addEventListener("click", function () {
        currentLessonIdx = idx;
        lessonsView = "detail";
        renderLessonsView();
      });
      lessonListEl.appendChild(row);
    });
  }

  function renderLessonDetail() {
    var lesson = (LESSONS[currentLang] || [])[currentLessonIdx];
    if (!lesson) { lessonDetailEl.innerHTML = ""; return; }
    lessonDetailEl.innerHTML =
      '<h3>' + lesson.title + '</h3>' +
      '<p>' + lesson.explanation + '</p>' +
      '<pre></pre>' +
      '<div class="quiz-box">' +
      '  <div class="quiz-q">Вопрос: ' + lesson.quiz.q + '</div>' +
      '  <button id="showAnswerBtn">Показать ответ</button>' +
      '  <div class="quiz-a" id="quizAnswer">' + lesson.quiz.a + '</div>' +
      '</div>';
    lessonDetailEl.querySelector("pre").textContent = lesson.code;
    var showBtn = document.getElementById("showAnswerBtn");
    var answerEl = document.getElementById("quizAnswer");
    showBtn.addEventListener("click", function () {
      answerEl.classList.toggle("shown");
    });
  }

  function renderLessonsView() {
    langListEl.classList.remove("open");
    lessonListEl.classList.remove("open");
    lessonDetailEl.classList.remove("open");
    if (lessonsView === "langs") {
      lessonsTitle.textContent = "Обучение языкам программирования";
      langListEl.classList.add("open");
      renderLangList();
    } else if (lessonsView === "lessons") {
      lessonsTitle.textContent = currentLang;
      lessonListEl.classList.add("open");
      renderLessonList();
    } else {
      lessonsTitle.textContent = currentLang;
      lessonDetailEl.classList.add("open");
      renderLessonDetail();
    }
  }

  lessonsBtn.addEventListener("click", function () {
    lessonsView = "langs";
    currentLang = null;
    currentLessonIdx = null;
    renderLessonsView();
    lessonsScreen.classList.add("open");
  });

  lessonsBackBtn.addEventListener("click", function () {
    if (lessonsView === "detail") {
      lessonsView = "lessons";
      renderLessonsView();
    } else if (lessonsView === "lessons") {
      lessonsView = "langs";
      currentLang = null;
      renderLessonsView();
    } else {
      lessonsScreen.classList.remove("open");
    }
  });
})();
</script>
</body>
</html>
