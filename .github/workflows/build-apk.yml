name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install

      - name: Cache local LLM model weights
        uses: actions/cache@v4
        with:
          path: www/models/model.gguf
          key: model-gguf-qwen2.5-0.5b-instruct-q4_k_m-v1

      - name: Download local LLM model weights (build-time only)
        run: npm run fetch:model

      - name: Build JS bundle + copy wllama wasm asset
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ai-assistant-debug.apk

      - name: Report APK size
        run: du -h ai-assistant-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-debug-apk
          path: ai-assistant-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Assistant v1.0.${{ github.run_number }}
          files: ai-assistant-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
