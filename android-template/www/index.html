<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Generated App</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#3880ff;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  nav{display:flex;gap:8px;}
  nav button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{flex:1;display:flex;overflow:hidden;}
  #sidebar{width:230px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
  #sidebar.hidden{display:none;}
  #sidebar .file{padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(255,255,255,.03);}
  #sidebar .file:hover{background:var(--panel);}
  #sidebar .file.active{background:var(--panel);color:var(--text);border-left:2px solid var(--accent);}
  #content{flex:1;overflow:auto;padding:18px 22px;}
  #content.readme{max-width:760px;line-height:1.6;}
  #content h1,#content h2,#content h3{color:#fff;}
  #content pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto;font-size:13px;line-height:1.55;}
  #content code{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;}
  #content :not(pre)>code{background:var(--panel);padding:2px 5px;border-radius:4px;}
  #content a{color:var(--accent);}
  #filepath{font-size:12px;color:var(--muted);margin-bottom:10px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="app-title">Generated App</h1>
    <nav>
      <button id="tab-readme" class="active">README</button>
      <button id="tab-files">Файлы</button>
    </nav>
  </header>
  <main>
    <div id="sidebar" class="hidden"></div>
    <div id="content" class="readme"></div>
  </main>
</div>
<script src="project-data.js"></script>
<script src="app.js"></script>
</body>
</html>
